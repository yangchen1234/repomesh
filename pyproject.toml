[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repomesh"
version = "0.1.0"
description = "Local, code-aware hybrid RAG compute node"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "qdrant-client>=1.15,<2",
  "tree-sitter>=0.25,<1",
  "tree-sitter-language-pack>=0.9,<1",
  "pathspec>=0.12,<1",
  "prometheus-client>=0.22,<1",
  "structlog>=25.4,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "psutil>=7,<8",
]

[project.scripts]
repomesh = "repomesh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repomesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["repomesh"]
warn_unused_ignores = true
disallow_untyped_defs = true
